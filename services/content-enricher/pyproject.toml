[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "content-enricher"
version = "0.1.0"
description = "Standalone CSV enrichment microservice for Gambio product exports"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
content-enricher = "app.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-dir]
app = "app"
